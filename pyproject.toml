[project]
name = "rag-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Higor Rodrigues dos Santos Cruz", email = "higorrsc@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.27.0",
    "numpy>=2.5.4",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.16.2",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
