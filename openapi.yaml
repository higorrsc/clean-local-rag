openapi: 3.1.0
info:
  title: Local RAG API
  version: 0.1.0
  description: Single source of truth for Local RAG CLI and REST API contracts.

paths:
  /health:
    get:
      summary: Service readiness and health status check
      operationId: health_check
      responses:
        '200':
          description: Service is healthy and operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /documents/ingest:
    post:
      summary: Ingest document text for vector chunking and indexing
      operationId: ingest_document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Document successfully chunked and indexed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'

  /documents/ingest/by-language:
    post:
      summary: Batch ingest all markdown documents from a language directory (docs/<language>)
      operationId: ingest_documents_by_language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIngestRequest'
      responses:
        '200':
          description: All documents in language directory successfully indexed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchIngestResponse'

  /query:
    post:
      summary: Semantic retrieval and LLM answer generation
      operationId: query_knowledge_base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Context-grounded response generated by LLM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          description: Health status of the API.
        version:
          type: string
          description: Application version string.

    IngestRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: Raw text of the document to ingest.
        source:
          type: string
          nullable: true
          description: Origin identifier such as a filename or URL.
        metadata:
          type: object
          additionalProperties: true
          description: Optional key-value metadata attached to this document.

    IngestResponse:
      type: object
      required:
        - chunks_count
        - status
      properties:
        chunks_count:
          type: integer
          description: Number of chunks created and stored in vector repository.
        status:
          type: string
          description: Ingestion status outcome.
        document_id:
          type: string
          nullable: true
          description: Optional identifier generated or assigned to the document.

    BatchIngestRequest:
      type: object
      required:
        - language
      properties:
        language:
          type: string
          description: Language directory code to scan (e.g. 'pt-br' or 'en').

    BatchIngestResponse:
      type: object
      required:
        - files_count
        - chunks_count
        - status
        - language
        - documents
      properties:
        files_count:
          type: integer
          description: Total number of markdown files found and ingested.
        chunks_count:
          type: integer
          description: Total number of chunks generated and stored.
        status:
          type: string
          description: Overall status of the batch ingestion.
        language:
          type: string
          description: Language code processed.
        documents:
          type: array
          items:
            type: string
          description: Names of documents successfully indexed.

    QueryRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          description: Question or query text to ask the RAG pipeline.
        top_k:
          type: integer
          default: 4
          minimum: 1
          description: Number of most similar document chunks to retrieve as context.

    SourceChunk:
      type: object
      required:
        - content
        - score
      properties:
        content:
          type: string
          description: Text content of the retrieved chunk.
        source:
          type: string
          nullable: true
          description: Origin source identifier of the chunk.
        score:
          type: number
          description: Similarity score (cosine similarity) of the chunk.

    QueryResponse:
      type: object
      required:
        - answer
        - sources
      properties:
        answer:
          type: string
          description: Natural language response produced by local LLM.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceChunk'
          description: List of context chunks retrieved and used to augment the answer.
