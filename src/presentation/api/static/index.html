<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local RAG - Web Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --user-bubble: #2563eb;
      --bot-bubble: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; color: #60a5fa; }
    .badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      background: #065f46;
      color: #6ee7b7;
    }
    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
    }
    .ingest-form {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    select, input, button {
      font-size: 0.95rem;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
    }
    button {
      background: var(--primary);
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .ingest-result {
      margin-top: 0.75rem;
      font-size: 0.875rem;
      display: none;
    }
    .chat-box {
      display: flex;
      flex-direction: column;
      height: 520px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message {
      max-width: 80%;
      padding: 0.85rem 1.15rem;
      border-radius: 1rem;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border-bottom-right-radius: 0.2rem;
    }
    .message.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      border-bottom-left-radius: 0.2rem;
    }
    .sources {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .sources summary { cursor: pointer; color: #93c5fd; }
    .source-item { margin-top: 0.35rem; }
    .chat-input-area {
      display: flex;
      gap: 0.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .chat-input-area input {
      flex: 1;
    }
  </style>
</head>
<body>
  <header>
    <h1>Local RAG - Interactive Web UI</h1>
    <span class="badge">100% Local &amp; Private</span>
  </header>
  <main>
    <section class="card">
      <h2 style="font-size: 1rem; margin-bottom: 0.75rem;">📁 Ingestão por Idioma (docs/&lt;language&gt;)</h2>
      <form class="ingest-form" id="ingest-form">
        <label for="language-select" style="font-size: 0.9rem; color: var(--text-muted);">Idioma:</label>
        <select id="language-select">
          <option value="pt-br" selected>Português (pt-br)</option>
          <option value="en">English (en)</option>
        </select>
        <button type="submit" id="btn-ingest">Carregar Documentos</button>
      </form>
      <div id="ingest-feedback" class="ingest-result"></div>
    </section>

    <section class="card chat-box">
      <div class="chat-messages" id="messages-container">
        <div class="message bot">Olá! Carregue os documentos de um idioma acima e faça perguntas sobre a base de conhecimento.</div>
      </div>
      <form class="chat-input-area" id="chat-form">
        <input type="text" id="query-input" placeholder="Digite sua pergunta (ex: Qual unidade é exclusiva para mulheres?)..." autocomplete="off" required />
        <button type="submit" id="btn-send">Perguntar</button>
      </form>
    </section>
  </main>

  <script>
    const ingestForm = document.getElementById('ingest-form');
    const ingestFeedback = document.getElementById('ingest-feedback');
    const btnIngest = document.getElementById('btn-ingest');
    const chatForm = document.getElementById('chat-form');
    const queryInput = document.getElementById('query-input');
    const btnSend = document.getElementById('btn-send');
    const messagesContainer = document.getElementById('messages-container');

    ingestForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const language = document.getElementById('language-select').value;
      btnIngest.disabled = true;
      btnIngest.textContent = 'Carregando...';
      ingestFeedback.style.display = 'block';
      ingestFeedback.style.color = '#94a3b8';
      ingestFeedback.textContent = `Lendo e indexando documentos da pasta docs/${language}...`;

      try {
        const res = await fetch('/documents/ingest/by-language', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language })
        });
        const data = await res.json();
        if (res.ok) {
          ingestFeedback.style.color = 'var(--success)';
          ingestFeedback.textContent = `✓ Sucesso! ${data.files_count} arquivos lidos, ${data.chunks_count} chunks indexados (${data.documents.join(', ')}).`;
        } else {
          ingestFeedback.style.color = 'var(--danger)';
          ingestFeedback.textContent = `Erro: ${data.detail || 'Falha ao indexar documentos.'}`;
        }
      } catch (err) {
        ingestFeedback.style.color = 'var(--danger)';
        ingestFeedback.textContent = `Erro de conexão: ${err.message}`;
      } finally {
        btnIngest.disabled = false;
        btnIngest.textContent = 'Carregar Documentos';
      }
    });

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = queryInput.value.trim();
      if (!question) return;

      appendMessage(question, 'user');
      queryInput.value = '';
      btnSend.disabled = true;

      const loadingMsg = appendMessage('Consultando a base de conhecimento...', 'bot');

      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, top_k: 4 })
        });
        const data = await res.json();
        if (res.ok) {
          loadingMsg.innerHTML = escapeHtml(data.answer);
          if (data.sources && data.sources.length > 0) {
            const sourcesDetails = document.createElement('details');
            sourcesDetails.className = 'sources';
            const summary = document.createElement('summary');
            summary.textContent = `Fontes recuperadas (${data.sources.length})`;
            sourcesDetails.appendChild(summary);

            data.sources.forEach((s) => {
              const item = document.createElement('div');
              item.className = 'source-item';
              item.textContent = `• [${s.source || 'Doc'}] (score: ${s.score.toFixed(4)}): ${s.content.substring(0, 120)}...`;
              sourcesDetails.appendChild(item);
            });
            loadingMsg.appendChild(sourcesDetails);
          }
        } else {
          loadingMsg.textContent = `Erro: ${data.detail || 'Não foi possível responder.'}`;
          loadingMsg.style.color = 'var(--danger)';
        }
      } catch (err) {
        loadingMsg.textContent = `Erro de conexão: ${err.message}`;
        loadingMsg.style.color = 'var(--danger)';
      } finally {
        btnSend.disabled = false;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    });

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      messagesContainer.appendChild(msg);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return msg;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
